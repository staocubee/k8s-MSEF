apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-internet-egress
  namespace: connectivity-tests
spec:
  podSelector:
    matchLabels:
      role: internet-deny
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution so TCP blocks on ports 80/443 without DNS lookup failure
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: v1
kind: Pod
metadata:
  name: test-deny-internet
  namespace: connectivity-tests
  labels:
    role: internet-deny
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: network-runner
      image: curlimages/curl:8.5.0
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}