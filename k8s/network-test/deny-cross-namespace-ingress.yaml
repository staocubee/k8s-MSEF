apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace-ingress
  namespace: isolated-target
spec:
  podSelector: {} # Applies to all pods in target namespace
  policyTypes:
    - Ingress
  ingress:
    # Only allow ingress from pods within its own namespace
    - from:
        - podSelector: {}