# Evaluation Focus:
# Detects unexpected interactive shell execution inside a running container.

apiVersion: v1
kind: Pod
metadata:
  name: unexpected-shell-test
  namespace: hardened
  annotations:
    msef.io/falco-rule: Detect unexpected shell
  labels:
    app: unexpected-shell-test
    environment: hardened

spec:
  serviceAccountName: hardened-app-sa
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
  - name: shell-trigger
    image: busybox:1.36

    command:
      - /bin/sh
      - -c
      - |
        echo "[+] Launching unexpected shell..."
        sh -c "echo runtime shell"
        sleep 3600

    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 101
      readOnlyRootFilesystem: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi