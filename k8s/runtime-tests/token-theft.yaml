# MSEF runtime scenario: token-theft. Simulation of the technique's observable behaviour,
# not an exploit. Expected rule: see scenarios.tsv
apiVersion: v1
kind: Pod
metadata:
  name: token-theft
  namespace: hardened
  labels:
    app: token-theft
    security: runtime-test
    msef.scenario: token-theft
spec:
  restartPolicy: Never
  serviceAccountName: msef-attack-sa
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: attack
    image: busybox:1.36
    command:
    - sh
    - -c
    - 'echo MSEF_READY

      sleep 8

      echo "MSEF_ATTACK_START scenario=token-theft"

      cat /var/run/secrets/kubernetes.io/serviceaccount/token > /dev/null

      echo MSEF_ATTACK_DONE

      sleep 300

      '
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
