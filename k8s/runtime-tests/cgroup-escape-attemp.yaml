apiVersion: v1
kind: Pod
metadata:
  name: cgroup-escape-attempt
  namespace: hardened
  labels:
    app: cgroup-escape-attempt
    security: runtime-test
spec:
  restartPolicy: Never
  serviceAccountName: hardened-app-sa
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: attack
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        echo "[+] Attempting container escape via cgroup notification release_agent..."
        mkdir -p /tmp/cgroup_mount 2>/dev/null || true
        touch /tmp/release_agent 2>/dev/null || true
        echo "#!/bin/sh\necho pwned" > /tmp/payload.sh 2>/dev/null || true
        sleep 5
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi