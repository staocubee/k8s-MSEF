# MSEF runtime scenario: internal-port-scan. Simulation of the technique's observable behaviour,
# not an exploit. Expected rule: see scenarios.tsv
apiVersion: v1
kind: Pod
metadata:
  name: internal-port-scan
  namespace: hardened
  labels:
    app: internal-port-scan
    security: runtime-test
    msef.scenario: internal-port-scan
spec:
  restartPolicy: Never
  serviceAccountName: msef-attack-sa
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: attack
    image: busybox:1.36
    command:
    - sh
    - -c
    - 'echo MSEF_READY

      sleep 8

      echo "MSEF_ATTACK_START scenario=internal-port-scan"

      for p in 2379 6443 10250 9090; do nc -z -w 1 "$KUBERNETES_SERVICE_HOST" "$p"
      || true; done

      echo MSEF_ATTACK_DONE

      sleep 300

      '
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
