apiVersion: v1
kind: Pod
metadata:
  name: internal-port-scan
  namespace: hardened
  labels:
    app: internal-port-scan
    security: runtime-test
spec:
  restartPolicy: Never
  serviceAccountName: hardened-app-sa
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: attack
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        echo "[+] Performing internal network recon probing..."
        for p in 53 80 443 6443 2379 8080 9090; do
          nc -z -w 1 kubernetes.default.svc "$p" 2>/dev/null || true
        done
        sleep 5
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi