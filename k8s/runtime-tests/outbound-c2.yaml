# MSEF runtime scenario: outbound-c2. Simulation of the technique's observable behaviour,
# not an exploit. Expected rule: see scenarios.tsv
apiVersion: v1
kind: Pod
metadata:
  name: outbound-c2
  namespace: hardened
  labels:
    app: outbound-c2
    security: runtime-test
    msef.scenario: outbound-c2
spec:
  restartPolicy: Never
  serviceAccountName: msef-attack-sa
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: attack
    image: busybox:1.36
    command:
    - sh
    - -c
    - 'echo MSEF_READY

      sleep 8

      echo "MSEF_ATTACK_START scenario=outbound-c2"

      nc -z -w 2 192.0.2.10 443 || true

      echo MSEF_ATTACK_DONE

      sleep 300

      '
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
