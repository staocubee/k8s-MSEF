# MSEF runtime scenario: metadata-theft. Simulation of the technique's observable behaviour,
# not an exploit. Expected rule: see scenarios.tsv
apiVersion: v1
kind: Pod
metadata:
  name: metadata-theft
  namespace: hardened
  labels:
    app: metadata-theft
    security: runtime-test
    msef.scenario: metadata-theft
spec:
  restartPolicy: Never
  serviceAccountName: msef-attack-sa
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: attack
    image: busybox:1.36
    command:
    - sh
    - -c
    - 'echo MSEF_READY

      sleep 8

      echo "MSEF_ATTACK_START scenario=metadata-theft"

      nc -w 2 169.254.169.254 80 < /dev/null || true

      echo MSEF_ATTACK_DONE

      sleep 300

      '
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
