apiVersion: v1
kind: Pod
metadata:
  name: benign-emptydir
  namespace: hardened
  labels:
    app: benign-emptydir
spec:
  serviceAccount: benign-sa
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: temp-writer
    image: busybox:1.36
    command: ["sh", "-c", "echo 'scratch data' > /tmp/scratch.txt && cat /tmp/scratch.txt"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 64Mi

      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
    - name: scratch-space
      mountPath: /tmp
  volumes:
  - name: scratch-space
    emptyDir: {}