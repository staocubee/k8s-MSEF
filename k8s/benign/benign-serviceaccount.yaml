apiVersion: v1
kind: ServiceAccount
metadata:
  name: benign-app-sa
  namespace: hardened
---
apiVersion: v1
kind: Pod
metadata:
  name: benign-serviceaccount
  namespace: hardened
  labels:
    app: benign-serviceaccount
spec:
  restartPolicy: Never
  serviceAccountName: benign-sa
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: sa-checker
    image: busybox:1.36
    command: ["sh", "-c", "ls -l /var/run/secrets/kubernetes.io/serviceaccount && sleep 5"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 64Mi

      limits:
        cpu: 200m
        memory: 128Mi