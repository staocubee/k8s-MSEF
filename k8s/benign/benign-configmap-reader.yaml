apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: hardened
data:
  app.conf: |
    LOG_LEVEL=info
    ENABLE_METRICS=true
---
apiVersion: v1
kind: Pod
metadata:
  name: benign-configmap-reader
  namespace: hardened
  labels:
    msef.test: benign
    app: benign-configmap-reader
spec:
  serviceAccountName: benign-sa
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: config-reader
    image: busybox:1.36
    command: ["sh", "-c", "cat /etc/config/app.conf && sleep 5"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 64Mi

      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
      readOnly: true
  volumes:
  - name: config-volume
    configMap:
      name: app-config