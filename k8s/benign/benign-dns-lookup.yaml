apiVersion: v1
kind: Pod
metadata:
  name: benign-dns-lookup
  namespace: hardened
  labels:
    app: benign-dns-lookup
spec:
  serviceAccountName: benign-sa
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: dns-lookup
    image: busybox:1.36
    command: ["sh", "-c", "nslookup kubernetes.default.svc.cluster.local && sleep 5"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 64Mi

      limits:
        cpu: 200m
        memory: 128Mi