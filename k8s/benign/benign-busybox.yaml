apiVersion: v1
kind: Pod
metadata:
  name: benign-busybox
  namespace: hardened
spec:
  serviceAccountName: benign-sa
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh","-c","echo hello && sleep 10"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 64Mi

      limits:
        cpu: 200m
        memory: 128Mi