apiVersion: v1
kind: Pod
metadata:
  name: benign-volume-reader
  namespace: hardened
  labels:
    app: benign-volume-reader
    msef.test: benign
spec:
  serviceAccount: benign-sa
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: volume-reader
    image: busybox:1.36
    command: ["sh", "-c", "ls -la /mnt/data && sleep 5"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 64Mi

      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
    - name: read-only-storage
      mountPath: /mnt/data
      readOnly: true
  volumes:
  - name: read-only-storage
    emptyDir: {}