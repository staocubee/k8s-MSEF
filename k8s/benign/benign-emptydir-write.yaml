apiVersion: v1
kind: Pod
metadata:
  name: benign-emptydir-write
  namespace: hardened
  labels:
    app: benign-emptydir-write
    security: runtime-test
spec:
  restartPolicy: Never

  serviceAccountName: hardened-app-sa

  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
  - name: attack

    image: busybox:1.36

    command:
      - sh
      - -c
      - |
        echo "[+] Performing legitimate temp log file write..."
        echo "log entry $(date)" > /tmp/app-status.log
        cat /tmp/app-status.log
        sleep 5

    volumeMounts:
      - mountPath: /tmp
        name: tmp-volume

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000

      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 50m
        memory: 64Mi

      limits:
        cpu: 100m
        memory: 128Mi

  volumes:
    - name: tmp-volume
      emptyDir: {}