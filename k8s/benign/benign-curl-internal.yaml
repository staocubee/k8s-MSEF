apiVersion: v1
kind: Pod
metadata:
  name: benign-curl-internal
  namespace: hardened
  labels:
    app: benign-curl-internal
spec:
  serviceAccountName: benign-sa
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: curl
    image: curlimages/curl:8.7.1
    command: ["sh", "-c", "curl -s -f http://kubernetes.default.svc.cluster.local/healthz || exit 0"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 64Mi

      limits:
        cpu: 200m
        memory: 128Mi