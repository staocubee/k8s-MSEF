apiVersion: v1
kind: Pod
metadata:
  name: benign-sleep
  namespace: hardened
  labels:
    app: benign-sleep
spec:
  serviceAccount: benign-sa
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: pause-container
    image: busybox:1.36
    command: ["sleep", "3600"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 64Mi

      limits:
        cpu: 200m
        memory: 128Mi