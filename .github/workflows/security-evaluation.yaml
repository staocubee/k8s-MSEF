name: Security Evaluation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stg
          - prod

permissions:
  contents: read
  id-token: write
  actions: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}

jobs:
  security-evaluation:
    name: Run Security Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures complete git history for diff/metric scripts

      - name: Create results directory
        run: mkdir -p results

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet || true
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> "$GITHUB_ENV"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ github.event.inputs.environment }}-msef-gke" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Verify cluster access
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get pods -n baseline
          kubectl get pods -n hardened
          kubectl get pods -n falco

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bc jq
          pip install -r scripts/requirements.txt

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run MSEF evaluation (same orchestrator as run-security)
        env:
          MSEF_FUZZ_SEED: "20261012"
          MSEF_RUNTIME_REPEATS: "1"
          MSEF_CONFIG_LABEL: "C5"
        run: scripts/run-k8s-security-evaluation.sh

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-evaluation-${{ github.event.inputs.environment }}
          path: results/