apiVersion: v1
kind: ConfigMap
metadata:
  name: msef-runtime-rules
  namespace: falco

data:
  msef-runtime-rules.yaml: |
    - rule: MSEF Outbound Curl
      desc: Detect outbound curl execution
      condition: >
        spawned_process and
        proc.name = curl
      output: >
        MSEF_OUTBOUND_CURL
        pod=%k8s.pod.name
        ns=%k8s.ns.name
        user=%user.name
        cmd=%proc.cmdline
      priority: WARNING
      tags: [msef, runtime, outbound]

    - rule: MSEF Network Connect
      desc: Detect network socket creation
      condition: >
        outbound and
        container
      output: >
        MSEF_NETWORK_CONNECT
        pod=%k8s.pod.name
        ns=%k8s.ns.name
        fd=%fd.name
      priority: WARNING
      tags: [msef, runtime, network]

    - rule: MSEF Sensitive File Read
      desc: Detect reads of sensitive files
      condition: >
        open_read and
        (
          fd.name startswith /etc/shadow or
          fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount
        )
      output: >
        MSEF_SENSITIVE_FILE
        pod=%k8s.pod.name
        file=%fd.name
      priority: CRITICAL
      tags: [msef, runtime, secrets]

    - rule: MSEF Root Filesystem Write
      desc: Detect writes to protected filesystem
      condition: >
        open_write and
        (
          fd.name startswith /bin or
          fd.name startswith /usr or
          fd.name startswith /root
        )
      output: >
        MSEF_ROOT_WRITE
        pod=%k8s.pod.name
        file=%fd.name
      priority: CRITICAL
      tags: [msef, runtime, filesystem]

    - rule: MSEF Unexpected Shell Execution

      desc: Detect interactive shell execution inside a workload

      condition: >
        spawned_process and
        container and
        proc.name in (bash, sh, ash, dash, zsh)

      output: >
        MSEF Runtime Test - Unexpected shell executed
        (user=%user.name
        command=%proc.cmdline
        pod=%k8s.pod.name
        namespace=%k8s.ns.name)

      priority: WARNING

      tags:
        - msef
        - runtime
        - shell