# 1. Driver Configuration
driver:
  enabled: true
  kind: modern_ebpf
  modernEbpf:
    bufSizePreset: 4

driverLoader:
  enabled: false

# 2. Falco Engine Configuration
# (ONLY Falco engine properties belong inside this block)
falco:
  json_output: true
  json_include_output_property: true
  json_include_tags_property: true
  log_level: info

# 3. Pod Resource Allocation (Root level in Helm values)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 4. GKE Security Context & Mounts for modern_ebpf
# GKE COS requires elevated capabilities and tracing mounts to pass scap_init
podSecurityContext:
  runAsUser: 0

containerSecurityContext:
  privileged: true

mounts:
  volumeMounts:
    - mountPath: /sys/kernel/debug
      name: sys-kernel-debug
    - mountPath: /sys/kernel/tracing
      name: sys-kernel-tracing
  volumes:
    - name: sys-kernel-debug
      hostPath:
        path: /sys/kernel/debug
    - name: sys-kernel-tracing
      hostPath:
        path: /sys/kernel/tracing

# 5. Custom Security Rules
customRules:
  msef-runtime-rules.yaml: |-
    - rule: MSEF Outbound Curl
      desc: Detect outbound curl execution
      condition: >
        spawned_process and
        proc.name in (curl,wget)
      output: >
        Outbound network tool executed
        (pod=%k8s.pod.name ns=%k8s.ns.name user=%user.name command=%proc.cmdline)
      priority: WARNING
      tags:
        - msef
        - runtime
        - network

    - rule: MSEF Network Connection
      desc: Detect outbound TCP connection
      condition: >
        outbound and
        fd.typechar = 4 and
        container
      output: >
        Outbound network connection
        (pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name connection=%fd.name)
      priority: NOTICE
      tags:
        - msef
        - runtime
        - network

    - rule: MSEF Sensitive File Read
      desc: Detect access to sensitive system files
      condition: >
        open_read and
        fd.name in (/etc/shadow,/etc/passwd,/etc/gshadow,/etc/sudoers)
      output: >
        Sensitive file accessed
        (pod=%k8s.pod.name proc=%proc.name file=%fd.name)
      priority: ERROR
      tags:
        - msef
        - runtime
        - filesystem

    - rule: MSEF Root Filesystem Write
      desc: Detect writes to protected filesystem locations
      condition: >
        open_write and
        fd.name startswith /etc
      output: >
        Root filesystem write
        (pod=%k8s.pod.name proc=%proc.name file=%fd.name)
      priority: ERROR
      tags:
        - msef
        - runtime
        - filesystem

    - rule: MSEF Unexpected Shell Execution
      desc: Detect interactive shell execution inside a workload
      condition: >
        spawned_process and
        container and
        proc.name in (bash, sh, ash, dash, zsh)
      output: >
        MSEF Runtime Test - Unexpected shell executed
        (user=%user.name command=%proc.cmdline pod=%k8s.pod.name)
      priority: WARNING
      tags:
        - msef
        - runtime
        - shell

# 6. Falcosidekick Sub-chart
falcosidekick:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi

  webui:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

  config:
    slack:
      webhookurl: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
      channel: "#security-alerts"
      minimumpriority: "warning"

    customfields: "environment:production,cluster:main"