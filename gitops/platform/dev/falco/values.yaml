# 1. Driver Selection
driver:
  enabled: true
  kind: modern_ebpf
  modernEbpf:
    bufSizePreset: 2
    cpusWithRingBuf: 1  # Forces 1 single ring buffer shared across all CPUs

# 2. Disable Unnecessary Loaders
driverLoader:
  enabled: false

falcoctl:
  artifact:
    follow:
      enabled: false

# 3. Host Namespaces
hostPID: true
hostNetwork: true
hostIPC: true

# 4. Pod & Container Security Context
podSecurityContext:
  runAsUser: 0

containerSecurityContext:
  privileged: true
  allowPrivilegeEscalation: true
  capabilities:
    add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - BPF
      - PERFMON
      - SYS_MODULE
      - SYS_RAWIO

# 5. Correct Host Mounts for GKE COS Kernel 6.x
# (Using chart-native extraVolumes and extraVolumeMounts)
extraVolumeMounts:
  - mountPath: /sys/kernel/debug
    name: sys-kernel-debug
  - mountPath: /sys/kernel/tracing
    name: sys-kernel-tracing
    readOnly: true
  - mountPath: /etc/asl
    name: asl-dir
    readOnly: true

extraVolumes:
  - name: sys-kernel-debug
    hostPath:
      path: /sys/kernel/debug
  - name: sys-kernel-tracing
    hostPath:
      path: /sys/kernel/tracing
  - name: asl-dir
    hostPath:
      path: /etc/asl

# 6. Logging
falco:
  log_level: debug
  json_output: true
  json_include_output_property: true
  json_include_tags_property: true

# 7. Rules Configuration
falcoRules:
  enabled: true

# 8. Resource Allocations
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 9. Custom Security Rules
customRules:
  msef-runtime-rules.yaml: |-
    - rule: MSEF Outbound Curl
      desc: Detect outbound curl execution
      condition: >
        evt.type in (execve, execveat) and
        evt.dir = < and
        proc.name in (curl, wget)
      output: >
        Outbound network tool executed
        (pod=%k8s.pod.name ns=%k8s.ns.name user=%user.name command=%proc.cmdline)
      priority: WARNING
      tags:
        - msef
        - runtime
        - network

    - rule: MSEF Network Connection
      desc: Detect outbound TCP connection
      condition: >
        evt.type = connect and
        evt.dir = < and
        fd.l4proto = tcp and
        container
      output: >
        Outbound network connection
        (pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name connection=%fd.name)
      priority: NOTICE
      tags:
        - msef
        - runtime
        - network

    - rule: MSEF Sensitive File Read
      desc: Detect access to sensitive system files
      condition: >
        evt.type in (open, openat, openat2) and
        evt.dir = < and
        fd.name in (/etc/shadow, /etc/passwd, /etc/gshadow, /etc/sudoers)
      output: >
        Sensitive file accessed
        (pod=%k8s.pod.name proc=%proc.name file=%fd.name)
      priority: ERROR
      tags:
        - msef
        - runtime
        - filesystem

    - rule: MSEF Root Filesystem Write
      desc: Detect writes to protected filesystem locations
      condition: >
        evt.type in (open, openat, openat2) and
        evt.dir = < and
        evt.arg.flags contains O_WRONLY and
        fd.name startswith /etc
      output: >
        Root filesystem write
        (pod=%k8s.pod.name proc=%proc.name file=%fd.name)
      priority: ERROR
      tags:
        - msef
        - runtime
        - filesystem

    - rule: MSEF Unexpected Shell Execution
      desc: Detect interactive shell execution inside a workload
      condition: >
        evt.type in (execve, execveat) and
        evt.dir = < and
        container and
        proc.name in (bash, sh, ash, dash, zsh)
      output: >
        MSEF Runtime Test - Unexpected shell executed
        (user=%user.name command=%proc.cmdline pod=%k8s.pod.name)
      priority: WARNING
      tags:
        - msef
        - runtime
        - shell

# 10. Falcosidekick Integration
falcosidekick:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: 30m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  webui:
    enabled: true
    resources:
      requests:
        cpu: 30m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  config:
    slack:
      webhookurl: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
      channel: "#security-alerts"
      minimumpriority: "warning"

    customfields: "environment:production,cluster:main"