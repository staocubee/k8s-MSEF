# 1. Driver Selection
driver:
  enabled: true
  kind: modern_ebpf
  modernEbpf:
    bufSizePreset: 2
    cpusWithRingBuf: 1  # Forces 1 single ring buffer shared across all CPUs

# 2. Disable Unnecessary Loaders
driverLoader:
  enabled: false

falcoctl:
  artifact:
    follow:
      enabled: false

# 3. Host Namespaces
hostPID: true
hostNetwork: true
hostIPC: true

# 4. Pod & Container Security Context
podSecurityContext:
  runAsUser: 0

containerSecurityContext:
  privileged: true
  allowPrivilegeEscalation: true
  capabilities:
    add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - BPF
      - PERFMON
      - SYS_MODULE
      - SYS_RAWIO

# 5. Correct Host Mounts for GKE COS Kernel 6.x
# (Using chart-native extraVolumes and extraVolumeMounts)
extraVolumeMounts:
  - mountPath: /sys/kernel/debug
    name: sys-kernel-debug
  - mountPath: /sys/kernel/tracing
    name: sys-kernel-tracing
    readOnly: true
  - mountPath: /etc/asl
    name: asl-dir
    readOnly: true

extraVolumes:
  - name: sys-kernel-debug
    hostPath:
      path: /sys/kernel/debug
  - name: sys-kernel-tracing
    hostPath:
      path: /sys/kernel/tracing
  - name: asl-dir
    hostPath:
      path: /etc/asl

# 6. Logging
falco:
  log_level: debug
  json_output: true
  json_include_output_property: true
  json_include_tags_property: true

# 7. Rules Configuration
falcoRules:
  enabled: true

# 8. Resource Allocations
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 9. Custom Security Rules
customRules:
  msef-runtime-rules.yaml: |-

    ###########################################################################
    # 1. Outbound Command-and-Control (C2)
    # Maps to: outbound-c2.yaml
    ###########################################################################
    - rule: MSEF Outbound C2 Communication
      desc: Detect execution of outbound C2 utilities inside hardened workloads
      condition: >
        evt.type in (execve, execveat) and
        evt.dir=< and
        container and
        k8s.ns.name="hardened" and
        proc.name in (curl, wget, nc)
      output: >
        MSEF Runtime Attack - Outbound C2 communication
        (pod=%k8s.pod.name proc=%proc.name command=%proc.cmdline user=%user.name)
      priority: WARNING
      tags:
        - msef
        - runtime
        - c2
        - network

    ###########################################################################
    # 2. Cloud Metadata Access
    # Maps to: metadata-theft.yaml
    ###########################################################################
    - rule: MSEF Cloud Metadata Access
      desc: Detect connections to cloud metadata endpoints
      condition: >
        evt.type=connect and
        evt.dir=< and
        container and
        k8s.ns.name="hardened" and
        (
          fd.rip=169.254.169.254 or
          fd.name contains "169.254.169.254"
        )
      output: >
        MSEF Runtime Attack - Cloud metadata access
        (pod=%k8s.pod.name proc=%proc.name destination=%fd.name)
      priority: CRITICAL
      tags:
        - msef
        - runtime
        - metadata

    ###########################################################################
    # 3. Service Account Token Theft
    # Maps to: token-theft.yaml
    ###########################################################################
    - rule: MSEF Service Account Token Access
      desc: Detect access to Kubernetes service account tokens
      condition: >
        evt.type in (open,openat,openat2) and
        evt.dir=< and
        container and
        k8s.ns.name="hardened" and
        fd.name startswith "/var/run/secrets/kubernetes.io/serviceaccount"
      output: >
        MSEF Runtime Attack - Service account token access
        (pod=%k8s.pod.name proc=%proc.name file=%fd.name)
      priority: ERROR
      tags:
        - msef
        - runtime
        - credentials

    ###########################################################################
    # 4. Interactive Shell
    # Maps to: interactive-shell.yaml
    ###########################################################################
    - rule: MSEF Interactive Shell
      desc: Detect interactive shell sessions inside hardened workloads
      condition: >
        evt.type in (execve,execveat) and
        evt.dir=< and
        container and
        k8s.ns.name="hardened" and
        proc.name in (bash,sh,ash,dash,zsh) and
        proc.args contains "-i"
      output: >
        MSEF Runtime Attack - Interactive shell
        (pod=%k8s.pod.name user=%user.name command=%proc.cmdline)
      priority: WARNING
      tags:
        - msef
        - runtime
        - shell

    ###########################################################################
    # 5. Protected Filesystem Write
    # Maps to: host-write-attempt.yaml
    ###########################################################################
    - rule: MSEF Protected Filesystem Write
      desc: Detect write attempts to protected filesystem locations
      condition: >
        evt.type in (open,openat,openat2) and
        evt.dir=< and
        container and
        k8s.ns.name="hardened" and
        evt.is_open_write=true and
        (
          fd.name startswith "/etc/" or
          fd.name startswith "/bin/" or
          fd.name startswith "/usr/" or
          fd.name startswith "/sbin/" or
          fd.name startswith "/root/"
        )
      output: >
        MSEF Runtime Attack - Protected filesystem write
        (pod=%k8s.pod.name proc=%proc.name file=%fd.name)
      priority: ERROR
      tags:
        - msef
        - runtime
        - filesystem

# 10. Falcosidekick Integration
falcosidekick:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: 30m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  webui:
    enabled: true
    resources:
      requests:
        cpu: 30m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  config:
    slack:
      webhookurl: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
      channel: "#security-alerts"
      minimumpriority: "warning"

    customfields: "environment:production,cluster:main"