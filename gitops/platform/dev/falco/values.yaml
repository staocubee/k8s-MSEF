# 1. Driver Selection
driver:
  enabled: true
  kind: modern_ebpf
  modernEbpf:
    bufSizePreset: 2
    cpusWithRingBuf: 1  # Forces 1 single ring buffer shared across all CPUs

# 2. Disable Unnecessary Loaders
driverLoader:
  enabled: false

falcoctl:
  artifact:
    follow:
      enabled: false

# 3. Host Namespaces
hostPID: true
hostNetwork: true
hostIPC: true

# 4. Pod & Container Security Context
podSecurityContext:
  runAsUser: 0

containerSecurityContext:
  privileged: true
  allowPrivilegeEscalation: true
  capabilities:
    add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - BPF
      - PERFMON
      - SYS_MODULE
      - SYS_RAWIO

# 5. Correct Host Mounts for GKE COS Kernel 6.x
# (Using chart-native extraVolumes and extraVolumeMounts)
extraVolumeMounts:
  - mountPath: /sys/kernel/debug
    name: sys-kernel-debug
  - mountPath: /sys/kernel/tracing
    name: sys-kernel-tracing
    readOnly: true
  - mountPath: /etc/asl
    name: asl-dir
    readOnly: true

extraVolumes:
  - name: sys-kernel-debug
    hostPath:
      path: /sys/kernel/debug
  - name: sys-kernel-tracing
    hostPath:
      path: /sys/kernel/tracing
  - name: asl-dir
    hostPath:
      path: /etc/asl

# 6. Logging
falco:
  log_level: debug
  json_output: true
  json_include_output_property: true
  json_include_tags_property: true

# 7. Rules Configuration
falcoRules:
  enabled: true

# 8. Resource Allocations
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 9. Custom Security Rules
customRules:
  msef-runtime-rules.yaml: |-
    # 1. Maps 1-to-1 with outbound-c2.yaml
    - rule: MSEF Outbound C2 Traffic
      desc: Detect outbound network communication attempt via netcat or wget
      condition: >
        evt.type in (execve, execveat) and
        evt.dir = < and
        container and
        proc.name in (nc, wget)
      output: >
        Outbound C2 tool executed
        (pod=%k8s.pod.name ns=%k8s.ns.name user=%user.name command=%proc.cmdline)
      priority: WARNING
      tags:
        - msef
        - runtime
        - network
        - c2

    # 2. Maps 1-to-1 with metadata-theft.yaml
    - rule: MSEF Cloud Metadata Server Access
      desc: Detect access attempts to cloud instance metadata endpoint (IMDS)
      condition: >
        evt.type = connect and
        evt.dir = < and
        container and
        fd.sip = 169.254.169.254
      output: >
        Cloud metadata access attempt detected
        (pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name dest=%fd.rip:%fd.rport)
      priority: CRITICAL
      tags:
        - msef
        - runtime
        - metadata
        - credentials

    # 3. Maps 1-to-1 with token-theft.yaml
    - rule: MSEF Token and Sensitive File Access
      desc: Detect reading service account tokens or sensitive system credential files
      condition: >
        evt.type in (open, openat, openat2) and
        evt.dir = < and
        container and
        (
          fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount or
          fd.name in (/etc/shadow, /etc/passwd, /etc/gshadow, /etc/sudoers)
        )
      output: >
        Sensitive token or system file accessed
        (pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name file=%fd.name user=%user.name)
      priority: ERROR
      tags:
        - msef
        - runtime
        - token
        - filesystem

    # 4. Maps 1-to-1 with interactive-shell.yaml
    - rule: MSEF Interactive Shell Execution
      desc: Detect execution of interactive shell sessions within workload container
      condition: >
        evt.type in (execve, execveat) and
        evt.dir = < and
        container and
        proc.name in (sh, bash, ash, dash, zsh) and
        proc.args contains "-i"
      output: >
        Interactive shell spawned in container
        (pod=%k8s.pod.name ns=%k8s.ns.name user=%user.name command=%proc.cmdline)
      priority: WARNING
      tags:
        - msef
        - runtime
        - shell

    # 5. Maps 1-to-1 with host-write-attempt.yaml
    - rule: MSEF Host Filesystem Write Attempt
      desc: Detect open/openat write attempts to protected locations like /etc
      condition: >
        evt.type in (open, openat, openat2) and
        evt.dir = < and
        container and
        (evt.arg.flags contains O_WRONLY or evt.arg.flags contains O_RDWR or evt.arg.flags contains O_CREAT) and
        fd.name startswith /etc
      output: >
        Unauthorized write attempt to protected directory
        (pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name file=%fd.name)
      priority: ERROR
      tags:
        - msef
        - runtime
        - filesystem
        
# 10. Falcosidekick Integration
falcosidekick:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: 30m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  webui:
    enabled: true
    resources:
      requests:
        cpu: 30m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  config:
     webhook:
      address: http://msef-kre-handler.hardened.svc.cluster.local:8080/webhook
      minimumpriority: "warning"

      customheaders:
        Content-Type: application/json