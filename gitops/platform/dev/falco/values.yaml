# 1. Driver Selection (Modern eBPF with 2MB Ring Buffer for GKE COS)
driver:
  enabled: true
  kind: modern_ebpf
  modernEbpf:
    bufSizePreset: 2

# 2. Disable Init Driver Loader (Not required for modern_ebpf)
driverLoader:
  enabled: false

# 3. Disable falcoctl Artifact Follower Sidecar
falcoctl:
  artifact:
    follow:
      enabled: false

# 4. Host Namespaces
hostPID: true
hostNetwork: true
hostIPC: true

# 5. Pod & Container Security Context for GKE COS
podSecurityContext:
  runAsUser: 0

containerSecurityContext:
  privileged: true
  allowPrivilegeEscalation: true
  capabilities:
    add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - BPF
      - PERFMON
      - SYS_MODULE

# 6. Custom Mounts (Only add paths not managed automatically by the Helm chart)
mounts:
  volumeMounts:
    - mountPath: /etc/asl
      name: asl-dir
      readOnly: true
  volumes:
    - name: asl-dir
      hostPath:
        path: /etc/asl

# 7. Engine Configuration
falco:
  log_level: debug  # Fixed duplicate key; kept debug to trace scap_init if needed
  json_output: true
  json_include_output_property: true
  json_include_tags_property: true

# 8. Base Rules
falcoRules:
  enabled: true

# 9. Resource Allocations
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# 10. Custom Security Rules
customRules:
  msef-runtime-rules.yaml: |-
    - rule: MSEF Outbound Curl
      desc: Detect outbound curl execution
      condition: >
        evt.type in (execve, execveat) and
        evt.dir = < and
        proc.name in (curl, wget)
      output: >
        Outbound network tool executed
        (pod=%k8s.pod.name ns=%k8s.ns.name user=%user.name command=%proc.cmdline)
      priority: WARNING
      tags:
        - msef
        - runtime
        - network

    - rule: MSEF Network Connection
      desc: Detect outbound TCP connection
      condition: >
        evt.type = connect and
        evt.dir = < and
        fd.l4proto = tcp and
        container
      output: >
        Outbound network connection
        (pod=%k8s.pod.name ns=%k8s.ns.name proc=%proc.name connection=%fd.name)
      priority: NOTICE
      tags:
        - msef
        - runtime
        - network

    - rule: MSEF Sensitive File Read
      desc: Detect access to sensitive system files
      condition: >
        evt.type in (open, openat, openat2) and
        evt.dir = < and
        fd.name in (/etc/shadow, /etc/passwd, /etc/gshadow, /etc/sudoers)
      output: >
        Sensitive file accessed
        (pod=%k8s.pod.name proc=%proc.name file=%fd.name)
      priority: ERROR
      tags:
        - msef
        - runtime
        - filesystem

    - rule: MSEF Root Filesystem Write
      desc: Detect writes to protected filesystem locations
      condition: >
        evt.type in (open, openat, openat2) and
        evt.dir = < and
        evt.arg.flags contains O_WRONLY and
        fd.name startswith /etc
      output: >
        Root filesystem write
        (pod=%k8s.pod.name proc=%proc.name file=%fd.name)
      priority: ERROR
      tags:
        - msef
        - runtime
        - filesystem

    - rule: MSEF Unexpected Shell Execution
      desc: Detect interactive shell execution inside a workload
      condition: >
        evt.type in (execve, execveat) and
        evt.dir = < and
        container and
        proc.name in (bash, sh, ash, dash, zsh)
      output: >
        MSEF Runtime Test - Unexpected shell executed
        (user=%user.name command=%proc.cmdline pod=%k8s.pod.name)
      priority: WARNING
      tags:
        - msef
        - runtime
        - shell

# 11. Falcosidekick Integration
falcosidekick:
  enabled: true
  replicaCount: 1

  resources:
    requests:
      cpu: 30m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  webui:
    enabled: true
    resources:
      requests:
        cpu: 30m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  config:
    slack:
      webhookurl: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
      channel: "#security-alerts"
      minimumpriority: "warning"

    customfields: "environment:production,cluster:main"