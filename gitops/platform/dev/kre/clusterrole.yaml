apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: msef-kre-controller
rules:
# Pod lookup, unique quarantine label, termination
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "patch", "delete"]
# Per-pod quarantine NetworkPolicies
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create", "delete"]
# Identity revocation: remove namespaced RoleBindings that name the SA.
# No create/bind/escalate: KRE never grants permissions.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["get", "list", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterrolebindings"]
  verbs: ["get", "list"]
